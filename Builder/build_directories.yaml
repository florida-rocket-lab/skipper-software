
# This file stores the directories to look in for each individual "build"
# when `generate_build_directories.py` is run, the names of each of these
# lists will become a directory and all the files in the directory will
# be flattened and all the of the "#include ..." will automatically update.
# Please note that any other path will **NOT** be automatically updated.

# This is the Arduino UNO that will serve as the transceiver on the ground.
ground_transceiver:
  - "../Software/shared"
  - "../Software/ground_transceiver"

ground_transceiver_test:  # This is the test suite to try on the UNO
  - "../Software/shared"
  - "../Software/ground_transceiver"
  - "../Software/tests/shared"
  - "../Software/tests/units/ground_transceiver_test"

# This is the Arduino Nano that will serve as the transceiver on Skipper.
skipper_transceiver:
  - "../Software/shared"
  - "../Software/skipper_transceiver"

skipper_transceiver_test:  # This is the test suite to try on the NANO
  - "../Software/shared"
  - "../Software/skipper_transceiver"
  - "../Software/tests/shared"
  - "../Software/tests/units/skipper_transceiver_test"

# This is the Teensy 4.0 that will serve as the flight computer for Skipper.
flight_computer:
  - "../Software/shared"
  - "../Software/flight_computer"

flight_computer_test:  # This is the test suite to try on the Teensy 4.0
  - "../Software/shared"
  - "../Software/flight_computer"
  - "../Software/tests/shared"
  - "../Software/tests/units/flight_computer_test"


groundstation:
  - "../Software/shared"
  - "../Software/ground_transceiver"
  - "../Software/tests/shared"
  - "../Software/tests/units/groundstation"

nano_tester:
  - "../Software/shared"
  - "../Software/skipper_transceiver"
  - "../Software/tests/shared"
  - "../Software/tests/units/nano_tester"

